[package]
name = "ncnn"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Safe Rust bindings for ncnn neural network inference framework"
keywords = ["ncnn", "neural-network", "inference", "deep-learning"]

[lib]
name = "ncnn"
path = "src/lib.rs"

[dependencies]
ncnn-sys = { path = "../ncnn-sys" }

[[example]]
name = "ncnn-simple"
path = "../examples/ncnn-simple.rs"
