[package]
name = "ncnn-sys"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Raw FFI bindings to ncnn C API (matching sherpa-ncnn bundled version)"
keywords = ["ncnn", "neural-network", "inference", "ffi"]
build = "build.rs"

[lib]
name = "ncnn_sys"
path = "src/lib.rs"

[build-dependencies]
bindgen = "0.69"
glob = "0.3"
