name: Build All Platforms

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-all.yaml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/build-all.yaml'
  workflow_dispatch:

concurrency:
  group: build-all-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-android:
    name: Android ${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64, x86]

    steps:
      - uses: actions/checkout@v4

      - name: Clone sherpa-ncnn
        run: |
          git clone --depth 1 https://github.com/aooohan/sherpa-ncnn.git
          echo "SHERPA_NCNN_VERSION=$(grep 'SHERPA_NCNN_VERSION' sherpa-ncnn/CMakeLists.txt | head -1 | cut -d'"' -f2)" >> $GITHUB_ENV

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: android-${{ matrix.abi }}

      - name: Build for ${{ matrix.abi }}
        run: |
          export CMAKE_CXX_COMPILER_LAUNCHER=ccache
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          export ANDROID_NDK=$ANDROID_NDK_LATEST_HOME

          cd sherpa-ncnn
          mkdir -p build-android-${{ matrix.abi }}
          cd build-android-${{ matrix.abi }}

          cmake -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_SHARED_LIBS=ON \
              -DSHERPA_NCNN_ENABLE_PORTAUDIO=OFF \
              -DSHERPA_NCNN_ENABLE_BINARY=OFF \
              -DSHERPA_NCNN_ENABLE_TEST=OFF \
              -DSHERPA_NCNN_ENABLE_C_API=ON \
              -DSHERPA_NCNN_ENABLE_JNI=OFF \
              -DSHERPA_NCNN_ENABLE_PYTHON=OFF \
              -DSHERPA_NCNN_ENABLE_GENERATE_INT8_SCALE_TABLE=OFF \
              -DCMAKE_INSTALL_PREFIX=./install \
              -DANDROID_ABI="${{ matrix.abi }}" \
              -DANDROID_PLATFORM=android-21 ..

          make -j$(nproc)
          make install/strip

      - name: Package artifacts
        run: |
          mkdir -p package/lib
          mkdir -p package/include

          cp sherpa-ncnn/build-android-${{ matrix.abi }}/install/lib/*.so package/lib/
          cp -r sherpa-ncnn/build-android-${{ matrix.abi }}/install/include/* package/include/

          tar czvf sherpa-ncnn-android-${{ matrix.abi }}.tar.gz -C package .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sherpa-ncnn-android-${{ matrix.abi }}
          path: sherpa-ncnn-android-${{ matrix.abi }}.tar.gz

  build-ios:
    name: iOS ${{ matrix.platform }}
    runs-on: macos-latest
    strategy:
      fail-fast: true
      matrix:
        platform: [arm64, simulator-arm64, simulator-x86_64]
        include:
          - platform: arm64
            cmake_platform: OS64
          - platform: simulator-arm64
            cmake_platform: SIMULATORARM64
          - platform: simulator-x86_64
            cmake_platform: SIMULATOR64

    steps:
      - uses: actions/checkout@v4

      - name: Clone sherpa-ncnn
        run: |
          git clone --depth 1 https://github.com/aooohan/sherpa-ncnn.git
          echo "SHERPA_NCNN_VERSION=$(grep 'SHERPA_NCNN_VERSION' sherpa-ncnn/CMakeLists.txt | head -1 | cut -d'"' -f2)" >> $GITHUB_ENV

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ios-${{ matrix.platform }}

      - name: Build OpenMP for iOS
        run: |
          export CMAKE_CXX_COMPILER_LAUNCHER=ccache
          export PATH="/usr/local/opt/ccache/libexec:$PATH"

          # Get absolute path to toolchain
          SHERPA_NCNN_DIR=$(pwd)/sherpa-ncnn
          TOOLCHAIN_FILE=$SHERPA_NCNN_DIR/toolchains/ios.toolchain.cmake

          cd sherpa-ncnn
          mkdir -p build-ios
          cd build-ios

          wget https://github.com/llvm/llvm-project/releases/download/llvmorg-11.0.0/openmp-11.0.0.src.tar.xz
          tar -xf openmp-11.0.0.src.tar.xz

          cd openmp-11.0.0.src
          sed -i '' '/.size __kmp_unnamed_critical_addr/d' runtime/src/z_Linux_asm.S
          sed -i '' 's/__kmp_unnamed_critical_addr/___kmp_unnamed_critical_addr/g' runtime/src/z_Linux_asm.S

          cmake -S . \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN_FILE" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=install \
            -DPLATFORM=${{ matrix.cmake_platform }} \
            -DENABLE_BITCODE=0 -DENABLE_ARC=0 -DENABLE_VISIBILITY=0 \
            -DPERL_EXECUTABLE=$(which perl) \
            -DLIBOMP_ENABLE_SHARED=OFF \
            -DLIBOMP_OMPT_SUPPORT=OFF \
            -DLIBOMP_USE_HWLOC=OFF \
            -B build

          cmake --build ./build -j 4
          cmake --build ./build --target install

      - name: Build sherpa-ncnn for iOS
        run: |
          export CMAKE_CXX_COMPILER_LAUNCHER=ccache
          export PATH="/usr/local/opt/ccache/libexec:$PATH"

          # Get absolute paths
          SHERPA_NCNN_DIR=$(pwd)/sherpa-ncnn
          TOOLCHAIN_FILE=$SHERPA_NCNN_DIR/toolchains/ios.toolchain.cmake
          BUILD_IOS_DIR=$SHERPA_NCNN_DIR/build-ios
          OMP_INCLUDE=$BUILD_IOS_DIR/openmp-11.0.0.src/install/include
          OMP_LIB=$BUILD_IOS_DIR/openmp-11.0.0.src/build/runtime/src/libomp.a

          export CPLUS_INCLUDE_PATH=$OMP_INCLUDE:$CPLUS_INCLUDE_PATH

          cd $BUILD_IOS_DIR

          cmake -S $SHERPA_NCNN_DIR \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN_FILE" \
            -DPLATFORM=${{ matrix.cmake_platform }} \
            -DENABLE_BITCODE=0 \
            -DENABLE_ARC=0 \
            -DENABLE_VISIBILITY=0 \
            -DOpenMP_C_FLAGS="-Xclang -fopenmp" \
            -DOpenMP_CXX_FLAGS="-Xclang -fopenmp" \
            -DOpenMP_C_LIB_NAMES="libomp" \
            -DOpenMP_CXX_LIB_NAMES="libomp" \
            -DOpenMP_libomp_LIBRARY="$OMP_LIB" \
            -DCMAKE_INSTALL_PREFIX=./install \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DSHERPA_NCNN_ENABLE_PYTHON=OFF \
            -DSHERPA_NCNN_ENABLE_PORTAUDIO=OFF \
            -DSHERPA_NCNN_ENABLE_JNI=OFF \
            -DSHERPA_NCNN_ENABLE_BINARY=OFF \
            -DSHERPA_NCNN_ENABLE_TEST=OFF \
            -DSHERPA_NCNN_ENABLE_C_API=ON \
            -B build

          cmake --build build -j 4
          cmake --build build --target install

      - name: Package artifacts
        run: |
          mkdir -p package/lib
          mkdir -p package/include

          cd sherpa-ncnn/build-ios

          # Copy libraries (dylib or static)
          cp build/lib/*.dylib ../../package/lib/ 2>/dev/null || cp build/lib/*.a ../../package/lib/ || true

          # Copy OpenMP
          cp openmp-11.0.0.src/build/runtime/src/libomp.a ../../package/lib/

          # Copy headers
          cp -r install/include/* ../../package/include/
          cp openmp-11.0.0.src/install/include/omp.h ../../package/include/

          cd ../..
          tar czvf sherpa-ncnn-ios-${{ matrix.platform }}.tar.gz -C package .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sherpa-ncnn-ios-${{ matrix.platform }}
          path: sherpa-ncnn-ios-${{ matrix.platform }}.tar.gz

  build-macos:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-latest
    strategy:
      fail-fast: true
      matrix:
        arch: [x86_64, arm64]

    steps:
      - uses: actions/checkout@v4

      - name: Clone sherpa-ncnn
        run: |
          git clone --depth 1 https://github.com/aooohan/sherpa-ncnn.git
          echo "SHERPA_NCNN_VERSION=$(grep 'SHERPA_NCNN_VERSION' sherpa-ncnn/CMakeLists.txt | head -1 | cut -d'"' -f2)" >> $GITHUB_ENV

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: macos-${{ matrix.arch }}

      - name: Install dependencies
        run: |
          brew install libomp

      - name: Build for ${{ matrix.arch }}
        run: |
          export CMAKE_CXX_COMPILER_LAUNCHER=ccache
          export PATH="/usr/local/opt/ccache/libexec:$PATH"

          cd sherpa-ncnn
          mkdir -p build-macos-${{ matrix.arch }}
          cd build-macos-${{ matrix.arch }}

          cmake \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DSHERPA_NCNN_ENABLE_PORTAUDIO=OFF \
            -DSHERPA_NCNN_ENABLE_BINARY=OFF \
            -DSHERPA_NCNN_ENABLE_TEST=OFF \
            -DSHERPA_NCNN_ENABLE_C_API=ON \
            -DSHERPA_NCNN_ENABLE_JNI=OFF \
            -DSHERPA_NCNN_ENABLE_PYTHON=OFF \
            -DSHERPA_NCNN_ENABLE_GENERATE_INT8_SCALE_TABLE=OFF \
            -DCMAKE_INSTALL_PREFIX=./install \
            ..

          make -j$(sysctl -n hw.ncpu)
          make install

      - name: Package artifacts
        run: |
          mkdir -p package/lib
          mkdir -p package/include

          cp sherpa-ncnn/build-macos-${{ matrix.arch }}/install/lib/*.dylib package/lib/
          cp -r sherpa-ncnn/build-macos-${{ matrix.arch }}/install/include/* package/include/

          tar czvf sherpa-ncnn-macos-${{ matrix.arch }}.tar.gz -C package .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sherpa-ncnn-macos-${{ matrix.arch }}
          path: sherpa-ncnn-macos-${{ matrix.arch }}.tar.gz

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-android, build-ios, build-macos]

    steps:
      - uses: actions/checkout@v4

      - name: Get sherpa-ncnn version
        id: version
        run: |
          git clone --depth 1 https://github.com/aooohan/sherpa-ncnn.git
          VERSION=$(grep 'SHERPA_NCNN_VERSION' sherpa-ncnn/CMakeLists.txt | head -1 | cut -d'"' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "SHERPA_NCNN_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: List artifacts
        run: |
          echo "=== Downloaded Artifacts ==="
          find artifacts -type f -name "*.tar.gz"

      - name: Collect all packages
        run: |
          mkdir -p release-packages
          find artifacts -name "*.tar.gz" -exec cp {} release-packages/ \;
          ls -lh release-packages/

      - name: Upload all packages as single artifact
        uses: actions/upload-artifact@v4
        with:
          name: all-packages
          path: release-packages/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: lib-${{ steps.version.outputs.version }}
          tag_name: lib-${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-packages/sherpa-ncnn-android-arm64-v8a.tar.gz
            release-packages/sherpa-ncnn-android-armeabi-v7a.tar.gz
            release-packages/sherpa-ncnn-android-x86_64.tar.gz
            release-packages/sherpa-ncnn-android-x86.tar.gz
            release-packages/sherpa-ncnn-ios-arm64.tar.gz
            release-packages/sherpa-ncnn-ios-simulator-arm64.tar.gz
            release-packages/sherpa-ncnn-ios-simulator-x86_64.tar.gz
            release-packages/sherpa-ncnn-macos-arm64.tar.gz
            release-packages/sherpa-ncnn-macos-x86_64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
