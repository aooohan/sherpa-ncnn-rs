name: Publish Crate

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Publish
        run: |
          cargo publish -p ncnn-sys
          sleep 30  # Wait for crates.io to index ncnn-sys
          cargo publish -p sherpa-ncnn-sys
          sleep 30  # Wait for crates.io to index sherpa-ncnn-sys
          cargo publish -p sherpa-ncnn-rs
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
